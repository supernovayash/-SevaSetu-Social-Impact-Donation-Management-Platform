spring.application.name=seva-setu

# ---- Database ----
spring.datasource.url=jdbc:postgresql://localhost:5432/sevasetu
spring.datasource.username=sevasetu_user
spring.datasource.password=changeme
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
# Generate a real secret with: openssl rand -base64 64
app.jwt.secret=REPLACE_WITH_A_LONG_RANDOM_BASE64_SECRET_AT_LEAST_256_BITS
app.jwt.access-token-expiry-ms=900000
app.jwt.refresh-token-expiry-ms=604800000

# ---- Razorpay (sandbox keys) ----
app.razorpay.key-id=rzp_test_REPLACE_ME
app.razorpay.key-secret=REPLACE_ME

# ---- Mail (use an app password, not your real Gmail password) ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=REPLACE_ME@gmail.com
spring.mail.password=REPLACE_ME
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---- Swagger ----
springdoc.swagger-ui.path=/swagger-ui.html
