
spring.application.name=seva-setu

# ---- Database ----
# ===============================
# MySQL Database Configuration
# ===============================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/SevaSetuDB}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:YOUR_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# Server
# ===============================

server.port=${PORT:8080}

# ---- JWT ----
# Generate a real secret with: openssl rand -base64 64
# ---- JWT ----

jwt.secret=${JWT_SECRET:YOUR_JWT_SECRET_KEY}

jwt.access-token-expiration-ms=900000

jwt.refresh-token-expiration-ms=604800000

# ---- Razorpay (sandbox keys) ----
razorpay.key.id=${RAZORPAY_KEY_ID:YOUR_RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:YOUR_RAZORPAY_KEY_SECRET}

# ---- Mail (use an app password, not your real Gmail password) ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:YOUR_MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD:YOUR_MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:YOUR_MAIL_USERNAME}

# ---- Swagger ----
springdoc.swagger-ui.path=/swagger-ui.html